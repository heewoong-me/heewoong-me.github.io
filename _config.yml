# -----------------------------------------------------------------------------
# Site identity
# -----------------------------------------------------------------------------

title: blank # if "blank", the full name below is used as the site title
first_name: Heewoong
middle_name:
last_name: Choi
description: Personal academic homepage of Heewoong Choi, a Ph.D. student in the M.IN.D Lab at Seoul National University.
keywords: Heewoong Choi, reinforcement learning, offline RL, goal-conditioned RL, machine learning, Seoul National University, MIND Lab
footer_text:
contact_note:
lang: en
icon: 🔎 # emoji used as the favicon (or an image filename in /assets/img/)

url: https://heewoong-me.github.io
baseurl: # subpath of the site, e.g. /blog/. Leave blank for root.
last_updated: false # footer "last updated" line
impressum_path:

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: false
footer_fixed: false
max_width: 930px


# -----------------------------------------------------------------------------
# Features
# -----------------------------------------------------------------------------

lazy_loading_images: true


# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: false
serve_schema_org: false
og_image:

# -----------------------------------------------------------------------------
# Analytics & search-engine verification (all disabled)
# -----------------------------------------------------------------------------

enable_google_verification: false
enable_bing_verification: false

google_site_verification:
bing_site_verification:

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    # Rendered inline on the About/News pages, so no standalone pages are built.
    # Set `output: true` if you ever need a news item to have its own URL.
    output: false

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

sass:
  style: compressed

# All personal content (about page, news, data, CV, photo) lives in content/
collections_dir: content
data_dir: content/data
include: ["_scripts"]
exclude:
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - purgecss.config.js
  - vendor
  - tools
  - CLAUDE.md
  - content/data # data files are read via data_dir, no need to publish them
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-sitemap
  - jemoji

# Keep assets out of the sitemap
defaults:
  - scope:
      path: assets
    values:
      sitemap: false

jekyll-minifier:
  exclude: ["robots.txt", "assets/js/search/*.js"]

# -----------------------------------------------------------------------------
# Assets & third-party libraries (consumed by _includes/head.liquid,
# _includes/scripts.liquid, and _plugins/download-3rd-party.rb)
# -----------------------------------------------------------------------------

imagemagick:
  enabled: true
  widths:
  - 480
  - 800
  - 1400
  input_directories:
  - content/
  input_formats:
  - .jpg
  - .jpeg
  - .png
  - .tiff
  - .gif
  output_formats:
    webp: -quality 85
third_party_libraries:
  download: false
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
  jquery:
    integrity:
      js: sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=
    url:
      js: https://cdn.jsdelivr.net/npm/jquery@{{version}}/dist/jquery.min.js
    version: 3.6.0
  mdb:
    integrity:
      css: sha256-jpjYvU3G3N6nrrBwXJoVEYI/0zw8htfFnhT9ljN3JJw=
      css_map: sha256-iYYMNfsJdVZjvsebJulg09miBXM4/GMTJgv1u5EZFFM=
      js: sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=
      js_map: sha256-UPgyn4YNsT0khkBK5553QwhnlbTlU0aa+igyc6qP1bE=
    url:
      css: https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/css/mdb.min.css
      css_map: https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/css/mdb.min.css.map
      js: https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/js/mdb.min.js
      js_map: https://cdn.jsdelivr.net/npm/mdbootstrap@{{version}}/js/mdb.min.js.map
    version: 4.20.0
